name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Bounded job budget: the full suite plus the native publish/link/run gates
    # must fail explicitly instead of hanging a PR indefinitely.
    timeout-minutes: 120
    env:
      ASSET_MANAGEMENT_RUNTIME_CONNECTION_STRING: &shared-pg 'Host=127.0.0.1;Port=5432;Database=crest_test;Username=test;Password=test'
      CREST_RUNTIME_PG_CONNECTION: *shared-pg
      CREST_GENERATED_CRUD_TEST_PG_CONNECTION: *shared-pg
      CREST_ERP_TEST_PG_CONNECTION: *shared-pg
      CREST_ERP_TEST_AMQP_CONNECTION: 'amqp://test:test@127.0.0.1:5672/'
      CREST_ERP_TEST_RABBIT_CONTAINER: crest-test-rabbitmq
      CREST_CAP_TEST_PG_CONNECTION: 'Host=127.0.0.1;Port=5433;Database=cap_test;Username=test;Password=test'
      CREST_CAP_TEST_PG_CONTAINER: crest-test-cap-pg
      CREST_CAP_TEST_AMQP_CONNECTION: 'amqp://test:test@127.0.0.1:5673/'
      CREST_CAP_TEST_RABBIT_CONTAINER: crest-test-cap-rabbitmq
      CREST_HEALTH_TEST_PG_CONNECTION: 'Host=127.0.0.1;Port=5434;Database=health_test;Username=test;Password=test'
      CREST_HEALTH_TEST_PG_CONTAINER: crest-test-health-pg
      CREST_HEALTH_TEST_REDIS_ENDPOINT: '127.0.0.1:6379'
      CREST_HEALTH_TEST_REDIS_CONTAINER: crest-test-health-redis
      CREST_RABBITMQ_HOST: '127.0.0.1'
      CREST_RABBITMQ_PORT: '5672'
      CREST_RABBITMQ_MGMT_PORT: '15672'
      CREST_RABBITMQ_USER: test
      CREST_RABBITMQ_PASSWORD: test
      CREST_TEST_CONTAINER_CLI: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '10.0.114'

      - name: Start external test services
        run: >-
          timeout 240s docker compose -p crest-test-services -f infra/docker-compose.test-services.yml
          up -d --wait --wait-timeout 180 pg16 rabbitmq cap-pg cap-rabbitmq health-pg redis

      - name: Restore
        run: dotnet restore CrestCreates.slnx

      # This binary-compatibility fixture is built by the projection test's
      # custom target, so it is not part of the solution restore graph.
      - name: Restore legacy compatibility fixture
        run: dotnet restore tests/Runtime/Agent/CrestCreates.Agent.Memory.TypeForwardLegacyConsumer/CrestCreates.Agent.Memory.TypeForwardLegacyConsumer.csproj

      - name: Bootstrap BuildTasks
        run: dotnet build src/Tooling/CrestCreates.BuildTasks/CrestCreates.BuildTasks.csproj --no-restore

      - name: Build
        run: dotnet build CrestCreates.slnx --no-restore

      # The Control Plane reference-data evidence ledger is written by test
      # runs into tests/artifacts/control-plane-evidence/. Clear any stale files
      # first so the executed-tuple gate can only be satisfied by this run.
      - name: Reset Control Plane reference-data evidence ledger
        run: rm -rf tests/artifacts/control-plane-evidence

      - name: Reset Phase 9c executed-tuple evidence ledger
        run: |
          rm -rf tests/artifacts/phase9c-evidence
          mkdir -p tests/artifacts/phase9c-evidence
          echo PHASE9C_EVIDENCE_ARTIFACT_DIR=$GITHUB_WORKSPACE/tests/artifacts/phase9c-evidence >> "$GITHUB_ENV"
          echo PHASE9C_EVIDENCE_ARTIFACT=$GITHUB_WORKSPACE/tests/artifacts/phase9c-evidence/ci.jsonl >> "$GITHUB_ENV"

      # Native AOT gates write evidence into tests/artifacts/aot-native-evidence/.
      # Clear stale files so the uploaded artifact can only contain this run's evidence.
      - name: Reset native AOT gate evidence directory
        run: rm -rf tests/artifacts/aot-native-evidence

      # ── Core ──
      - name: Test — Core
        run: dotnet test tests/Core/CrestCreates.Core.Abstractions.Tests --no-build

      # ── Framework ──
      - name: Test — Framework / DDD
        run: |
          dotnet test tests/Framework/Ddd/CrestCreates.Domain.Tests --no-build
          dotnet test tests/Framework/Ddd/CrestCreates.Application.Tests --no-build

      - name: Test — Framework / Infrastructure
        run: |
          dotnet test tests/Framework/Infrastructure/CrestCreates.Infrastructure.Tests --no-build
          dotnet test tests/Framework/Infrastructure/CrestCreates.Localization.Tests --no-build
          dotnet test tests/Framework/Infrastructure/CrestCreates.Logging.Tests --no-build
          dotnet test tests/Framework/Infrastructure/CrestCreates.VirtualFileSystem.Tests --no-build

      - name: Test — Framework / API (DynamicApi + Capability)
        run: |
          dotnet test tests/Framework/Api/CrestCreates.DynamicApi.Tests --no-build
          # NativeAotGate tests publish and execute a native binary and run in
          # the NativeAOT gate section below; keep this step JIT-fast.
          dotnet test tests/Framework/Api/CrestCreates.CapabilityEndpoint.AotFixture.Tests --no-build --filter "Category!=NativeAotGate"
          dotnet test tests/Framework/Api/CrestCreates.CompatibilityProjection.E2E.Tests --no-build
          # #128 formal CRUD: JIT-side composition/HTTP/UoW/relational cases; the
          # native publish/link/run gate runs in the NativeAOT section below.
          dotnet test tests/Framework/Api/CrestCreates.GeneratedCrud.AotFixture.Tests --no-build --filter "Category!=NativeAotGate"
          # #129 S5 formal Ticket HTTP projection cases against the real AppService
          # bundle; the native publish/link/run gate runs below.
          dotnet test tests/Framework/Api/CrestCreates.TicketHttpProjection.AotFixture.Tests --no-build --filter "Category!=NativeAotGate"

      - name: Test — Framework / Web
        run: dotnet test tests/Framework/Web/CrestCreates.Web.Tests --no-build

      - name: Test — Persistence / ORM providers (UnitOfWork kernel, chain, capabilities, AOP weave, CAP lease)
        run: dotnet test tests/Persistence/CrestCreates.OrmProviders.Tests --no-build

      # The framework platform HTTP surface (User / Role / PermissionGrant / Setting /
      # SettingDefinition / Feature / FeatureDefinition / Tenant / AuditLog query) is now
      # re-published through the formal ExplicitHost projection (G-09, clean REST) via
      # AddCrestPlatformManagementHttp in the Library host. The former #129 rev.2 §14.6
      # exclusions are removed: these tests are rewritten to the new clean-REST contract
      # (proper verbs, plural prefixes, string enums) and run in full. OIDC short-name
      # claims (name/email) are now emitted by IdentityClaimsBuilder, so LoginAndRefresh runs.
      - name: Test — Integration suite (auth / tenant / permission / audit / UoW / health)
        run: dotnet test tests/Framework/Web/CrestCreates.IntegrationTests --no-build

      - name: Test — Framework / Modules
        run: |
          dotnet test tests/Framework/Modules/CrestCreates.FileManagement.Tests --no-build
          dotnet test tests/Framework/Modules/CrestCreates.Form.Tests --no-build
          dotnet test tests/Framework/Modules/CrestCreates.ModuleDiagnostics.Tests --no-build
          dotnet test tests/Framework/Modules/CrestCreates.Organization.Tests --no-build
          dotnet test tests/Framework/Modules/CrestCreates.Scheduling.Tests --no-build

      - name: Test — Framework / Testing
        run: |
          dotnet test tests/Framework/Testing/CrestCreates.TestBase.Tests --no-build
          dotnet test tests/Framework/Testing/CrestCreates.Samples.Tests --no-build

      # ── Golden Samples ──
      - name: Test — Procurement Approval Golden Sample
        run: |
          dotnet test samples/ProcurementApproval/tests/CrestCreates.Sample.Procurement.Tests --no-build
          dotnet test samples/ProcurementApproval/tests/CrestCreates.Sample.Procurement.E2E.Tests --no-build
          dotnet test samples/ProcurementApproval/tests/CrestCreates.Sample.Procurement.AotFixture.Tests --no-build

      - name: Test — Asset Management Golden Sample
        run: |
          dotnet test samples/AssetManagement/tests/CrestCreates.Sample.AssetManagement.Tests --no-build
          dotnet test samples/AssetManagement/tests/CrestCreates.Sample.AssetManagement.E2E.Tests --no-build
          dotnet test samples/AssetManagement/tests/CrestCreates.Sample.AssetManagement.AotFixture.Tests --no-build

      - name: Test — Phase 10b business construction friction review
        run: dotnet test samples/AssetManagement/tests/CrestCreates.Sample.AssetManagement.Tests --no-build --filter "FullyQualifiedName~Phase10bBusinessConstructionFrictionReviewTests"

      # Phase 10a review-closure cases are kept as an explicit CI signal in
      # addition to the full project suites below: provider-boundary outbox
      # precision, semantic jsonb equality, and abort replay/compensation.
      - name: Test — Phase 10a review closure contracts
        run: |
          dotnet test samples/AssetManagement/tests/CrestCreates.Sample.AssetManagement.Tests --no-build --filter "FullyQualifiedName~OrganizationScope"
          dotnet test tests/Runtime/Persistence/CrestCreates.Runtime.Persistence.InMemory.Tests --no-build --filter "FullyQualifiedName~Append_rejects_manually_constructed_high_precision_message"
          dotnet test tests/Persistence/CrestCreates.Runtime.Persistence.PostgreSql.Tests --no-build --filter "FullyQualifiedName~WorkflowAbort_|FullyQualifiedName~Append_rejects_manually_constructed_high_precision_message|FullyQualifiedName~PostgreSqlJsonEqualityContractTests"

      # ── Metadata ──
      - name: Test — Metadata / Core
        run: |
          dotnet test tests/Metadata/Core/CrestCreates.Metadata.Tests --no-build
          dotnet test tests/Metadata/Core/CrestCreates.Metadata.Tests --no-build --filter "FullyQualifiedName~RuntimeDescriptorPin"
          dotnet test tests/Metadata/Core/CrestCreates.Metadata.ContextPack.Tests --no-build
          dotnet test tests/Metadata/Core/CrestCreates.Schema.Tests --no-build
          dotnet test tests/Metadata/Core/CrestCreates.Snapshot.Tests --no-build

      - name: Test — Metadata / Draft
        run: |
          dotnet test tests/Metadata/Draft/CrestCreates.DescriptorDraft.Tests --no-build

      # ── Runtime ──
      - name: Test — Runtime / Capability
        run: dotnet test tests/Runtime/Capability/CrestCreates.Capability.Tests --no-build

      - name: Test — Runtime / Workflow & HumanTask
        run: |
          dotnet test tests/Runtime/Persistence/CrestCreates.Runtime.Persistence.Tests --no-build
          dotnet test tests/Runtime/Persistence/CrestCreates.Runtime.Persistence.InMemory.Tests --no-build
          dotnet test tests/Runtime/Workflow/CrestCreates.Workflow.Tests --no-build
          dotnet test tests/Runtime/HumanTask/CrestCreates.HumanTask.Tests --no-build

      # PostgreSQL contract, crash-window, retention and NativeAOT fixture tests use
      # the shared PostgreSQL 16 service and are required evidence for the direct Npgsql provider.
      - name: Test — Persistence / PostgreSQL direct Npgsql provider
        run: |
          dotnet test tests/Persistence/CrestCreates.Runtime.Persistence.PostgreSql.Tests --no-build
          dotnet test tests/Persistence/CrestCreates.Runtime.Persistence.PostgreSql.AotFixture.Tests --no-build

      # Phase 9b+ durable Agent Memory evidence gates: the frozen Spec §18 skeleton
      # (44 names) and the 59-case / 98-tuple evidence ledger are enforced by the
      # boundary discovery guards; the SliceN activation guards run as part of the
      # full boundary suite. The AOT fixture above executes the original linux-x64
      # binary and asserts CRESTCREATES_DURABLE_AGENT_MEMORY_OK.
      - name: Test — Durable Agent Memory evidence activation guards
        run: |
          dotnet test tests/Boundary/CrestCreates.DependencyBoundaries.Tests --no-build \
            --filter "FullyQualifiedName~DurableAgentMemory|FullyQualifiedName~Slice|FullyQualifiedName~AllDurableAgentMemoryEvidenceTests"
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.Memory.Tests --no-build \
            --filter "FullyQualifiedName~Persistence|FullyQualifiedName~Curation"

      - name: Test — Runtime / Agent
        run: |
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.ControlPlane.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.DraftContracts.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.Memory.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.Memory.Accountability.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.Memory.Llm.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.Authoring.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.Prompting.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.Tools.Abstractions.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.Tools.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.Tools.E2E.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.Memory.Projection.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.Memory.ReadCore.Tests --no-build

      - name: Test — Runtime / Eventing
        run: |
          dotnet test tests/Runtime/Eventing/CrestCreates.Runtime.Delivery.Tests --no-build
          dotnet test tests/Runtime/Eventing/CrestCreates.Event.Tests --no-build
          dotnet test tests/Runtime/Eventing/CrestCreates.EventBus.Tests --no-build

      - name: Test — Runtime / Audit & DistributedTransaction
        run: |
          dotnet test tests/Runtime/Audit/CrestCreates.Accountability.Abstractions.Tests --no-build
          dotnet test tests/Runtime/Audit/CrestCreates.Accountability.Tests --no-build
          dotnet test tests/Runtime/Audit/CrestCreates.AuditLogging.Tests --no-build
          dotnet test tests/Runtime/DistributedTransaction/CrestCreates.DistributedTransaction.Tests --no-build

      - name: Test — Runtime / CAP atomic publish (dedicated PostgreSQL and RabbitMQ)
        run: |
          dotnet test tests/Runtime/DistributedTransaction/CrestCreates.DistributedTransaction.CAP.IntegrationTests --no-build
        # #125: real PG + RabbitMQ fault matrix (scan-recovery delivery, rollback holds no
        # rows, identity/refusal negatives, host-restart recovery). Tuning: lookback 30s +
        # interval 2s keeps the nominal scan wait bounded.

      # ── Tooling ──
      - name: Test — Tooling (CodeGenerator + BuildTasks)
        run: |
          dotnet test tests/Tooling/CrestCreates.CodeGenerator.Tests --no-build
          dotnet test tests/Tooling/CrestCreates.BuildTasks.Tests --no-build
          dotnet test tests/Tooling/CrestCreates.Agent.DraftContractGenerator.Tests --no-build

      - name: Test — JSON contract ownership gates
        run: bash .github/scripts/run-json-contract-contract-gates.sh

      # ── Integrations ──
      - name: Test — Integrations (MCP)
        run: |
          dotnet test tests/Integrations/CrestCreates.Mcp.Tests --no-build
          dotnet test tests/Integrations/CrestCreates.Mcp.E2E.Tests --no-build
          dotnet test tests/Integrations/CrestCreates.Mcp.Memory.Tests --no-build

      # ── Boundary ──
      # The reference-data evidence gate consumes files produced by all prior
      # evidence suites. xUnit does not guarantee cross-class ordering inside a
      # collection, so run the producer suite and the final exact-set gate as
      # separate commands.
      - name: Test — Dependency Boundaries
        run: dotnet test tests/Boundary/CrestCreates.DependencyBoundaries.Tests --no-build --filter "FullyQualifiedName!~ControlPlaneReferenceDataSpecTestSkeletonTests"

      - name: Test — Control Plane reference-data evidence ledger gate
        run: dotnet test tests/Boundary/CrestCreates.DependencyBoundaries.Tests --no-build --filter "FullyQualifiedName~ControlPlaneReferenceDataSpecTestSkeletonTests"

      # ── NativeAOT execute gates — publish/link/run real native binaries ──
      # Each gate test performs its own Release publish(CrestCreatesPublishMode=aot),
      # native link, execution of the original binary and its own assertions, so
      # the former publish-only steps were removed rather than publishing twice.
      # Evidence is written to tests/artifacts/aot-native-evidence/ and uploaded
      # below with an always() condition.
      - name: Test — CapabilityEndpoint native HTTP gate (NativeAOT publish/link/run)
        run: dotnet test tests/Framework/Api/CrestCreates.CapabilityEndpoint.AotFixture.Tests --no-build --filter "Category=NativeAotGate"

      - name: Test — Core native gate (NativeAOT publish/link/run)
        run: dotnet test tests/Core/CrestCreates.Core.AotHost.Tests --no-build --filter "Category=NativeAotGate"

      - name: Test — GeneratedCrud native HTTP gate (NativeAOT publish/link/run)
        run: dotnet test tests/Framework/Api/CrestCreates.GeneratedCrud.AotFixture.Tests --no-build --filter "Category=NativeAotGate"

      - name: Test — Ticket formal HTTP projection native gate (NativeAOT publish/link/run)
        run: dotnet test tests/Framework/Api/CrestCreates.TicketHttpProjection.AotFixture.Tests --no-build --filter "Category=NativeAotGate"

      - name: Test — MCP native pipeline gate (NativeAOT publish/link/run)
        run: dotnet test tests/Integrations/CrestCreates.Mcp.AotFixture.Tests --no-build

      - name: Test — Agent.Tools native pipeline gate (NativeAOT publish/link/run)
        run: dotnet test tests/Runtime/Agent/CrestCreates.Agent.Tools.AotFixture.Tests --no-build

      - name: Test — UnitOfWork native pipeline gate (NativeAOT publish/link/run)
        run: dotnet test tests/Persistence/CrestCreates.Data.Abstractions.AotFixture.Tests --no-build

      - name: Test — LocalEvent typed dispatch/replay native gate (NativeAOT publish/link/run)
        run: dotnet test tests/Runtime/Eventing/CrestCreates.EventBus.Local.AotHost.Tests --no-build

      - name: Test — RabbitMQ static bindings trim + native gates (publish/link/run, real broker)
        run: dotnet test tests/Runtime/Eventing/CrestCreates.EventBus.RabbitMQ.AotHost.Tests --no-build

      - name: Test — Memory JSON contract AotFixtures (NativeAOT publish/link/run)
        run: bash .github/scripts/run-json-contract-aot-gates.sh

      - name: Test — ControlPlane JsonContracts AotFixture (NativeAOT publish/link/run)
        run: dotnet test tests/Runtime/Agent/CrestCreates.Agent.ControlPlane.JsonContracts.AotFixture.Tests --no-build

      - name: Upload native AOT gate evidence (publish/stdout/stderr/request transcripts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aot-native-evidence-${{ github.sha }}
          path: tests/artifacts/aot-native-evidence/
          if-no-files-found: warn
          retention-days: 7

      # The old runner-green closure was intentionally removed: it could mark
      # every acceptance in a project as Passed without the case assertion ever
      # executing. Real producers may append assertion-produced tuples to the
      # shared artifact above, but the exact-set closure remains disabled until
      # every required runner emits its tuples.
      - name: Test — Phase 9c executable evidence tuple guards
        run: |
          dotnet test tests/Persistence/CrestCreates.Runtime.Persistence.PostgreSql.Tests --no-build \
            --filter "FullyQualifiedName~FrozenCaseMatrix_ShouldRetainAllRcaEvidenceSurfaces|FullyQualifiedName~CriticalPhase9cSources_ShouldRemainBoundToProductionCode"
