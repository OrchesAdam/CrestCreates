name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore CrestCreates.slnx

      # This binary-compatibility fixture is built by the projection test's
      # custom target, so it is not part of the solution restore graph.
      - name: Restore legacy compatibility fixture
        run: dotnet restore tests/Runtime/Agent/CrestCreates.Agent.Memory.TypeForwardLegacyConsumer/CrestCreates.Agent.Memory.TypeForwardLegacyConsumer.csproj

      - name: Bootstrap BuildTasks
        run: dotnet build src/Tooling/CrestCreates.BuildTasks/CrestCreates.BuildTasks.csproj --no-restore

      - name: Build
        run: dotnet build CrestCreates.slnx --no-restore

      - name: Test
        # Keep service-backed integration suites out of the default CI gate.
        # They require PostgreSQL, Kafka, or RabbitMQ containers and belong in
        # an explicitly provisioned integration workflow.
        run: >-
          dotnet test CrestCreates.slnx --no-build
          --filter
          "FullyQualifiedName!~CrestCreates.IntegrationTests&FullyQualifiedName!~SaaSHelpdesk.Tests&FullyQualifiedName!~CrestCreates.EventBus.Kafka.Tests.Integration&FullyQualifiedName!~CrestCreates.EventBus.RabbitMQ.Tests.Integration"
