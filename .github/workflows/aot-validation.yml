name: AOT Validation

# Disabled: the fixture workflow currently contains long-running host
# processes and a trimmed publish path that requires a separate BuildTasks
# bootstrap. Keep the definition for a future repair without scheduling it.
on: []

concurrency:
  group: aot-validation
  cancel-in-progress: true

jobs:
  # Tier 2 NativeAOT publish — real publish-and-run validation
  native-aot-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      # ── CapabilityEndpoint AotFixture ──
      - name: Publish — CapabilityEndpoint AotFixture (NativeAOT)
        run: dotnet publish tests/Framework/Api/CrestCreates.CapabilityEndpoint.AotFixture -c Release -r linux-x64 --self-contained true -p:CrestCreatesPublishMode=aot

      - name: Run — CapabilityEndpoint AotFixture
        run: |
          ./tests/Framework/Api/CrestCreates.CapabilityEndpoint.AotFixture/bin/Release/net10.0/linux-x64/publish/CrestCreates.CapabilityEndpoint.AotFixture

      # ── MCP AotFixture ──
      - name: Publish — MCP AotFixture (NativeAOT)
        run: dotnet publish tests/Integrations/CrestCreates.Mcp.AotFixture -c Release -r linux-x64 --self-contained true -p:CrestCreatesPublishMode=aot

      - name: Run — MCP AotFixture
        run: |
          ./tests/Integrations/CrestCreates.Mcp.AotFixture/bin/Release/net10.0/linux-x64/publish/CrestCreates.Mcp.AotFixture

      # ── Agent.Tools AotFixture ──
      - name: Publish — Agent.Tools AotFixture (NativeAOT)
        run: dotnet publish tests/Runtime/Agent/CrestCreates.Agent.Tools.AotFixture -c Release -r linux-x64 --self-contained true -p:CrestCreatesPublishMode=aot

      - name: Run — Agent.Tools AotFixture
        run: |
          ./tests/Runtime/Agent/CrestCreates.Agent.Tools.AotFixture/bin/Release/net10.0/linux-x64/publish/CrestCreates.Agent.Tools.AotFixture

      # ── MCP Memory AotFixture ──
      - name: Publish — MCP Memory AotFixture (NativeAOT)
        run: dotnet publish tests/Integrations/CrestCreates.Mcp.Memory.AotFixture -c Release -r linux-x64 --self-contained true -p:CrestCreatesPublishMode=aot

      - name: Run — MCP Memory AotFixture
        run: |
          ./tests/Integrations/CrestCreates.Mcp.Memory.AotFixture/bin/Release/net10.0/linux-x64/publish/CrestCreates.Mcp.Memory.AotFixture

  # PublishTrimmed validation — default mode for sample projects
  trimmed-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Publish — LibraryManagement.Web (Trimmed)
        run: dotnet publish samples/LibraryManagement/LibraryManagement.Web -c Release -r linux-x64 --self-contained true

      - name: Publish — SaaSHelpdesk.Web (Trimmed)
        run: dotnet publish samples/SaaSHelpdesk/SaaSHelpdesk.Web -c Release -r linux-x64 --self-contained true

  # Cross-platform NativeAOT matrix — only in nightly
  cross-platform-aot:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Publish — CapabilityEndpoint AotFixture (${{ matrix.rid }})
        run: dotnet publish tests/Framework/Api/CrestCreates.CapabilityEndpoint.AotFixture -c Release -r ${{ matrix.rid }} --self-contained true -p:CrestCreatesPublishMode=aot
