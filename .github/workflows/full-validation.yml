name: Full Validation

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: full-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore CrestCreates.slnx

      # This binary-compatibility fixture is built by the projection test's
      # custom target, so it is not part of the solution restore graph.
      - name: Restore legacy compatibility fixture
        run: dotnet restore tests/Runtime/Agent/CrestCreates.Agent.Memory.TypeForwardLegacyConsumer/CrestCreates.Agent.Memory.TypeForwardLegacyConsumer.csproj

      # BuildTasks is imported by many projects through CrestCreates.Modules.props.
      # It is not a project dependency in the solution graph, so a clean parallel
      # solution build can otherwise evaluate consumers before the task assembly exists.
      - name: Bootstrap BuildTasks
        run: dotnet build src/Tooling/CrestCreates.BuildTasks/CrestCreates.BuildTasks.csproj --no-restore

      - name: Build
        run: dotnet build CrestCreates.slnx --no-restore

      # ── Core unit tests ──
      - name: Test — Core
        run: dotnet test tests/Core/CrestCreates.Core.Abstractions.Tests --no-build

      # ── Framework tests ──
      - name: Test — Framework / DDD
        run: |
          dotnet test tests/Framework/Ddd/CrestCreates.Domain.Tests --no-build
          dotnet test tests/Framework/Ddd/CrestCreates.Application.Tests --no-build

      - name: Test — Framework / Infrastructure
        run: |
          dotnet test tests/Framework/Infrastructure/CrestCreates.Infrastructure.Tests --no-build
          dotnet test tests/Framework/Infrastructure/CrestCreates.Localization.Tests --no-build
          dotnet test tests/Framework/Infrastructure/CrestCreates.Logging.Tests --no-build
          dotnet test tests/Framework/Infrastructure/CrestCreates.VirtualFileSystem.Tests --no-build

      - name: Test — Framework / API (DynamicApi + Capability)
        run: |
          dotnet test tests/Framework/Api/CrestCreates.DynamicApi.Tests --no-build
          # NativeAotGate tests publish and execute a native binary and run in
          # the native-aot-gates job below; keep this step JIT-fast.
          dotnet test tests/Framework/Api/CrestCreates.CapabilityEndpoint.AotFixture.Tests --no-build --filter "Category!=NativeAotGate"
          dotnet test tests/Framework/Api/CrestCreates.CompatibilityProjection.E2E.Tests --no-build

      - name: Test — Framework / Web
        run: |
          dotnet test tests/Framework/Web/CrestCreates.Web.Tests --no-build

      - name: Test — Framework / Modules
        run: |
          dotnet test tests/Framework/Modules/CrestCreates.FileManagement.Tests --no-build
          dotnet test tests/Framework/Modules/CrestCreates.Form.Tests --no-build
          dotnet test tests/Framework/Modules/CrestCreates.ModuleDiagnostics.Tests --no-build
          dotnet test tests/Framework/Modules/CrestCreates.Organization.Tests --no-build
          dotnet test tests/Framework/Modules/CrestCreates.Scheduling.Tests --no-build

      - name: Test — Framework / Testing
        run: |
          dotnet test tests/Framework/Testing/CrestCreates.TestBase.Tests --no-build
          dotnet test tests/Framework/Testing/CrestCreates.Samples.Tests --no-build

      # ── Golden Samples ──
      - name: Test — Procurement Approval Golden Sample
        run: |
          dotnet test samples/ProcurementApproval/tests/CrestCreates.Sample.Procurement.Tests --no-build
          dotnet test samples/ProcurementApproval/tests/CrestCreates.Sample.Procurement.E2E.Tests --no-build
          dotnet test samples/ProcurementApproval/tests/CrestCreates.Sample.Procurement.AotFixture.Tests --no-build

      # ── Metadata tests ──
      - name: Test — Metadata / Core
        run: |
          dotnet test tests/Metadata/Core/CrestCreates.Metadata.Tests --no-build
          dotnet test tests/Metadata/Core/CrestCreates.Metadata.ContextPack.Tests --no-build
          dotnet test tests/Metadata/Core/CrestCreates.Schema.Tests --no-build
          dotnet test tests/Metadata/Core/CrestCreates.Snapshot.Tests --no-build

      - name: Test — Metadata / Draft
        run: |
          dotnet test tests/Metadata/Draft/CrestCreates.DescriptorDraft.Tests --no-build
          dotnet test tests/Metadata/Draft/CrestCreates.Draft.Tests --no-build

      # ── Runtime tests ──
      - name: Test — Runtime / Capability
        run: dotnet test tests/Runtime/Capability/CrestCreates.Capability.Tests --no-build

      - name: Test — Runtime / Workflow & HumanTask
        run: |
          dotnet test tests/Runtime/Workflow/CrestCreates.Workflow.Tests --no-build
          dotnet test tests/Runtime/HumanTask/CrestCreates.HumanTask.Tests --no-build

      - name: Test — Runtime / Agent
        run: |
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.ControlPlane.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.DraftContracts.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.Memory.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.Memory.Accountability.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.Memory.Llm.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.Authoring.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.Prompting.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.Tools.Abstractions.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.Tools.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.Tools.E2E.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.Memory.Projection.Tests --no-build
          dotnet test tests/Runtime/Agent/CrestCreates.Agent.Memory.ReadCore.Tests --no-build

      - name: Test — Runtime / Eventing
        run: |
          dotnet test tests/Runtime/Eventing/CrestCreates.Event.Tests --no-build
          dotnet test tests/Runtime/Eventing/CrestCreates.EventBus.Tests --no-build

      - name: Test — Runtime / Audit & DistributedTransaction
        run: |
          dotnet test tests/Runtime/Audit/CrestCreates.Accountability.Abstractions.Tests --no-build
          dotnet test tests/Runtime/Audit/CrestCreates.Accountability.Tests --no-build
          dotnet test tests/Runtime/Audit/CrestCreates.AuditLogging.Tests --no-build
          dotnet test tests/Runtime/DistributedTransaction/CrestCreates.DistributedTransaction.Tests --no-build

      # ── Tooling tests ──
      - name: Test — Tooling (CodeGenerator + BuildTasks)
        run: |
          dotnet test tests/Tooling/CrestCreates.CodeGenerator.Tests --no-build
          dotnet test tests/Tooling/CrestCreates.BuildTasks.Tests --no-build
          dotnet test tests/Tooling/CrestCreates.Agent.DraftContractGenerator.Tests --no-build

      - name: Test — JSON contract ownership gates
        run: bash .github/scripts/run-json-contract-contract-gates.sh

      # ── Integrations tests ──
      - name: Test — Integrations (MCP)
        run: |
          dotnet test tests/Integrations/CrestCreates.Mcp.Tests --no-build
          dotnet test tests/Integrations/CrestCreates.Mcp.E2E.Tests --no-build
          dotnet test tests/Integrations/CrestCreates.Mcp.Memory.Tests --no-build

      # ── Boundary tests ──
      - name: Test — Dependency Boundaries
        run: dotnet test tests/Boundary/CrestCreates.DependencyBoundaries.Tests --no-build

  # NativeAOT execute gates — publish/link/run the original native binaries.
  native-aot-gates:
    runs-on: ubuntu-latest
    # Bounded job budget: the native publish/link/run gates must fail explicitly
    # instead of hanging indefinitely.
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Bootstrap BuildTasks
        run: dotnet build src/Tooling/CrestCreates.BuildTasks/CrestCreates.BuildTasks.csproj

      # Native AOT gates write evidence into tests/artifacts/aot-native-evidence/.
      - name: Reset native AOT gate evidence directory
        run: rm -rf tests/artifacts/aot-native-evidence

      - name: Test — CapabilityEndpoint native HTTP gate (NativeAOT publish/link/run)
        run: dotnet test tests/Framework/Api/CrestCreates.CapabilityEndpoint.AotFixture.Tests --filter "Category=NativeAotGate"

      - name: Test — MCP native pipeline gate (NativeAOT publish/link/run)
        run: dotnet test tests/Integrations/CrestCreates.Mcp.AotFixture.Tests

      - name: Test — Agent.Tools native pipeline gate (NativeAOT publish/link/run)
        run: dotnet test tests/Runtime/Agent/CrestCreates.Agent.Tools.AotFixture.Tests

      - name: Test — Memory JSON contract AotFixtures (NativeAOT publish/link/run)
        run: bash .github/scripts/run-json-contract-aot-gates.sh

      - name: Upload native AOT gate evidence (publish/stdout/stderr/request transcripts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aot-native-evidence-${{ github.sha }}
          path: tests/artifacts/aot-native-evidence/
          if-no-files-found: warn
          retention-days: 7
