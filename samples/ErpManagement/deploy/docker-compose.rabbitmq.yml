# Optional local access to the broker already included in the base stack.
# docker compose -f docker-compose.yml -f docker-compose.rabbitmq.yml up -d
services:
  rabbitmq:
    ports:
      - "127.0.0.1:${ERP_RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${ERP_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
