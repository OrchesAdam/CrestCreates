# 长驻测试服务（集成测试唯一外部依赖来源）。
# 启动：podman-compose -f infra/docker-compose.test-services.yml up -d
# 环境变量对照表见 infra/README.md。故障注入套件（CAP/Health）使用专属实例，
# 测试经 CLI 停启 crest-test-cap-* / crest-test-health-*，不得停启共享实例。
x-fault-injection-labels: &fault-injection-labels
  io.crestcreates.test-services.config: v1

# Separate containers keep published ports and container identities consistent between Podman and Docker.
x-podman:
  in_pod: false

services:
  pg16:
    image: postgres:16-alpine
    container_name: crest-test-pg16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: crest_test
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - crest-test-pg16:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U test -d crest_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  cap-pg:
    image: postgres:16-alpine
    container_name: crest-test-cap-pg
    labels: *fault-injection-labels
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: cap_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - crest-test-cap-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U test -d cap_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  health-pg:
    image: postgres:17-alpine
    container_name: crest-test-health-pg
    labels: *fault-injection-labels
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: health_test
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - crest-test-health-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U test -d health_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: crest-test-rabbitmq
    hostname: crest-test-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: test
      RABBITMQ_DEFAULT_PASS: test
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - crest-test-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "su-exec rabbitmq rabbitmq-diagnostics -q check_port_listener 5672 && su-exec rabbitmq rabbitmq-diagnostics -q check_port_listener 15672"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  cap-rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: crest-test-cap-rabbitmq
    labels: *fault-injection-labels
    hostname: crest-test-cap-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: test
      RABBITMQ_DEFAULT_PASS: test
    ports:
      - "127.0.0.1:5673:5672"
    volumes:
      - crest-test-cap-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "su-exec rabbitmq rabbitmq-diagnostics -q check_port_listener 5672"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: crest-test-health-redis
    labels: *fault-injection-labels
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - crest-test-health-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0
    container_name: crest-test-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DELETE_TOPIC_ENABLE: "true"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  mongo:
    image: mongo:7
    container_name: crest-test-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - crest-test-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok === 1 ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20

# 卷名由 Compose 项目名派生（-p crest-test-services）；不要切换项目名，否则会挂载空卷。
volumes:
  crest-test-pg16:
  crest-test-cap-pg:
  crest-test-health-pg:
  crest-test-rabbitmq:
  crest-test-cap-rabbitmq:
  crest-test-health-redis:
  crest-test-mongo: